<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Magic Catering</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* ===========================================================
   MAGIC CATERING — светлая версия по ТЗ 1.1
   Песочный фон · молочный воздух · терракота · графит
   =========================================================== */

:root {
  /* песок и молоко */
  --sand-50:  #faf6ef;   /* молочный — воздух и свет */
  --sand-100: #f2ebdf;
  --sand-200: #e9dfce;   /* песочный — основной фон */
  --sand-300: #ddd0b9;
  --sand-400: #c9b99d;

  /* терракота — акцент и кнопки */
  --terra-400: #c4714f;
  --terra-500: #a04e2e;
  --terra-600: #853f25;

  /* графит — текст */
  --ink:   #2a2420;
  --ink-2: #4b423b;
  --ink-3: #6b6058;
  --ink-4: #9b9085;

  --line:      rgba(42, 36, 32, 0.14);
  --line-soft: rgba(42, 36, 32, 0.08);

  --display: "Cormorant Garamond", "Times New Roman", serif;
  --sans: "Montserrat", -apple-system, "Segoe UI", system-ui, sans-serif;

  --container: 1280px;
  --gutter: clamp(20px, 5vw, 72px);

  --s--1: clamp(0.78rem, 0.76rem + 0.1vw, 0.85rem);
  --s-0:  clamp(0.97rem, 0.94rem + 0.15vw, 1.06rem);
  --s-1:  clamp(1.12rem, 1.04rem + 0.4vw, 1.35rem);
  --s-2:  clamp(1.5rem, 1.3rem + 0.9vw, 2.1rem);
  --s-3:  clamp(2rem, 1.6rem + 1.9vw, 3.4rem);
  --s-4:  clamp(2.6rem, 1.9rem + 3.4vw, 5.2rem);

  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; overflow-x: clip; scroll-padding-top: 92px; }

body {
  margin: 0;
  background: var(--sand-200);
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: var(--s-0);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
body.is-locked { overflow: hidden; }

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--terra-500); outline-offset: 3px; }

h1, h2, h3 {
  font-family: var(--display);
  font-weight: 500;
  line-height: 1.07;
  letter-spacing: -0.012em;
  color: var(--ink);
  text-wrap: balance;
  margin: 0;
}
p { margin: 0; }

/* ---------- каркас ---------- */

.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.sec { padding-block: clamp(64px, 9vw, 150px); }
.sec--tight { padding-block: clamp(44px, 6vw, 92px); }
.sec--milk { background: var(--sand-50); }
.sec--line { border-top: 1px solid var(--line-soft); }

.stack { display: flex; flex-direction: column; }
.g8 { gap: 8px; } .g12 { gap: 12px; } .g16 { gap: 16px; } .g24 { gap: 24px; }
.g32 { gap: 32px; } .g48 { gap: clamp(28px, 4vw, 48px); } .g72 { gap: clamp(36px, 6vw, 72px); }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

.eyebrow { font-size: var(--s--1); letter-spacing: .2em; text-transform: uppercase; color: var(--terra-600); font-weight: 600; }
.lede { font-size: var(--s-1); color: var(--ink-2); max-width: 54ch; line-height: 1.55; }
.muted { color: var(--ink-3); }
.small { font-size: var(--s--1); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- кнопки ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 14px 32px; border: 1px solid transparent; border-radius: 2px;
  font-size: var(--s--1); font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  cursor: pointer; background: none; transition: background .25s, color .25s, border-color .25s;
}
.btn--main { background: var(--terra-500); color: var(--sand-50); }
.btn--main:hover { background: var(--terra-600); }
.btn--line { border-color: var(--ink); color: var(--ink); }
.btn--line:hover { background: var(--ink); color: var(--sand-50); }
.btn--ghost { border-color: var(--line); color: var(--ink-2); }
.btn--ghost:hover { border-color: var(--ink); color: var(--ink); }

.arrow {
  display: inline-flex; align-items: center; gap: 10px; width: fit-content;
  font-size: var(--s--1); letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
  color: var(--terra-500); border-bottom: 1px solid currentColor; padding-bottom: 4px;
  transition: gap .25s;
}
.arrow:hover { gap: 16px; }

/* ---------- шапка ---------- */

.hdr {
  position: sticky; top: 0; z-index: 60;
  background: transparent;
  backdrop-filter: none;
  border-bottom: 1px solid transparent;
  transition: background .35s, border-color .35s, box-shadow .35s;
}
.hdr--over:not(.is-stuck) .logo__mark { color: var(--sand-50); }
.hdr--over:not(.is-stuck) .logo__sub { color: var(--sand-300); }
.hdr--over:not(.is-stuck) .nav a { color: var(--sand-100); }
.hdr--over:not(.is-stuck) .nav a:hover, .hdr--over:not(.is-stuck) .nav a.is-on { color: var(--sand-50); border-bottom-color: var(--sand-50); }
.hdr--over:not(.is-stuck) .hdr__tel { color: var(--sand-100); }
.hdr--over:not(.is-stuck) .burger { border-color: rgba(250,246,239,.5); }
.hdr--over:not(.is-stuck) .burger span { background: var(--sand-50); }
.hdr:not(.is-stuck) .hdr__cta {
  background: none; color: var(--ink); border-color: var(--ink);
}
.hdr--over:not(.is-stuck) .hdr__cta { color: var(--sand-50); border-color: rgba(250,246,239,.7); }
.hdr.is-stuck { background: rgba(250, 246, 239, .95); backdrop-filter: blur(16px); border-bottom-color: var(--line-soft); box-shadow: 0 10px 30px rgba(42,36,32,.06); }
.hdr__in { display: flex; align-items: center; gap: clamp(14px, 2vw, 34px); min-height: 84px; transition: min-height .35s; }
.hdr.is-stuck .hdr__in { min-height: 70px; }

.logo { display: flex; flex-direction: column; margin-right: auto; flex: none; line-height: 1; }
.logo__mark { font-family: var(--display); font-size: 1.6rem; letter-spacing: .26em; text-transform: uppercase; color: var(--ink); }
.logo__sub { font-size: .58rem; letter-spacing: .34em; color: var(--ink-3); margin-top: 7px; padding-left: .2em; }

.nav { display: flex; align-items: center; gap: clamp(4px, 1vw, 16px); flex: none; }
.nav a {
  font-size: .76rem; letter-spacing: .11em; text-transform: uppercase; font-weight: 600;
  color: var(--ink-2); white-space: nowrap; padding: 8px 2px; border-bottom: 1px solid transparent;
  transition: color .2s, border-color .2s;
}
.nav a:hover, .nav a.is-on { color: var(--terra-500); border-bottom-color: var(--terra-500); }

.hdr__tel { font-size: .85rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.burger { display: none; width: 48px; height: 48px; border: 1px solid var(--line); background: none; cursor: pointer; flex: none; }
.burger span { display: block; width: 18px; height: 1px; background: var(--ink); margin: 4px auto; }

.drawer {
  position: fixed; inset: 0; z-index: 70; background: var(--sand-50);
  padding: 22px var(--gutter) 40px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .3s, transform .4s cubic-bezier(.2,.7,.3,1), visibility .3s;
}
.drawer.is-open { opacity: 1; visibility: visible; transform: none; }
.drawer a { padding: 16px 0; border-bottom: 1px solid var(--line-soft); font-size: 1.05rem; color: var(--ink); }
.drawer__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }

/* ---------- медиа-плашки (место под съёмку) ---------- */

.shot {
  position: relative; overflow: hidden; aspect-ratio: 4 / 3;
  background:
    radial-gradient(90% 80% at 25% 20%, rgba(196,113,79,.16), transparent 60%),
    radial-gradient(80% 70% at 80% 85%, rgba(201,185,157,.55), transparent 62%),
    linear-gradient(150deg, var(--sand-300), var(--sand-100));
  border: 1px solid var(--line-soft);
}
.shot::after {
  content: attr(data-note);
  position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px;
  font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); background: linear-gradient(transparent, rgba(250,246,239,.85));
}
.shot--wide { aspect-ratio: 16 / 9; }
.shot--tall { aspect-ratio: 3 / 4; }
.shot--sq   { aspect-ratio: 1 / 1; }
.shot--hero { aspect-ratio: auto; min-height: clamp(420px, 68vh, 720px); }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shot--photo::after { color: var(--sand-100); background: linear-gradient(transparent, rgba(26,19,15,.75)); }
.shot--v2 { filter: hue-rotate(-8deg); }
.shot--v3 { filter: hue-rotate(12deg) saturate(.9); }
.shot--v4 { filter: saturate(.75) brightness(1.03); }

/* ---------- первый экран ---------- */

.hero {
  position: relative;
  margin-top: -84px;            /* кадр уходит под шапку */
  min-height: 100svh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.hero__bg { position: absolute; inset: 0; }
.hero__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.hero__bg .shot { width: 100%; height: 100%; aspect-ratio: auto; border: 0; }
.hero__bg .shot::after { content: none; }
.hero__bg::after {            /* вуаль под текст: кадр тёплый и тёмный, текст светлый */
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(68% 58% at 50% 46%, rgba(26,19,15,.62), rgba(26,19,15,.3) 62%, transparent 82%),
    linear-gradient(rgba(26,19,15,.5), rgba(26,19,15,.12) 30%, rgba(26,19,15,.25) 72%, rgba(233,223,206,.92));
}
.hero__in {
  position: relative; z-index: 2;
  padding-top: 84px; padding-bottom: clamp(32px, 6vh, 64px);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: clamp(18px, 3vh, 30px);
}
.hero__lockup { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.hero__lockup b {
  font-family: var(--display); font-weight: 500;
  font-size: clamp(3.4rem, 2rem + 7vw, 7.5rem);
  letter-spacing: .1em; text-transform: uppercase; color: var(--sand-50);
  padding-left: .1em;
  text-shadow: 0 2px 30px rgba(26,19,15,.45);
}
.hero__lockup span {
  font-size: clamp(.78rem, .6rem + .5vw, 1.15rem);
  letter-spacing: .32em; color: var(--sand-100); margin-top: clamp(6px, 1.2vh, 14px);
  padding-left: .32em;
}
.hero h1 {
  font-family: var(--sans); font-weight: 400;
  font-size: clamp(1.02rem, .9rem + .6vw, 1.5rem);
  letter-spacing: .01em; line-height: 1.5; color: var(--sand-100);
  max-width: 30ch;
  text-shadow: 0 1px 20px rgba(26,19,15,.5);
}
.hero__meta { font-size: var(--s--1); letter-spacing: .18em; text-transform: uppercase; color: var(--sand-300); }
.hero .btn--pill {
  border-radius: 999px; border: 1px solid rgba(250,246,239,.75); color: var(--sand-50);
  background: rgba(26,19,15,.22); backdrop-filter: blur(4px);
  padding: 16px 46px; min-height: 58px;
}
.hero .btn--pill:hover { background: var(--sand-50); color: var(--ink); border-color: var(--sand-50); }
.hero__scroll {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--sand-200);
  z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hero__scroll::after { content: ""; width: 1px; height: 26px; background: var(--sand-200); opacity: .6; }

/* ---------- цена ---------- */

.price { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.price__fig { font-family: var(--display); font-size: var(--s-4); color: var(--ink); line-height: 1; }
.price__list { display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--ink-2); font-size: var(--s-1); }
.price__list span::before { content: "· "; color: var(--terra-500); }

/* ---------- формы ---------- */

.form { display: flex; flex-direction: column; gap: 14px; background: var(--sand-50); padding: clamp(22px, 3vw, 36px); border: 1px solid var(--line-soft); }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: var(--s--1); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.input {
  width: 100%; min-height: 52px; padding: 13px 16px;
  background: #fff; border: 1px solid var(--line); border-radius: 2px; color: var(--ink);
  transition: border-color .2s;
}
.input::placeholder { color: var(--ink-4); }
.input:focus { border-color: var(--terra-500); outline: none; }
textarea.input { min-height: 104px; resize: vertical; }
.check { display: flex; gap: 11px; align-items: flex-start; font-size: .84rem; color: var(--ink-3); cursor: pointer; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--terra-500); flex: none; }

/* ---------- сетки и карточки ---------- */

.grid { display: grid; gap: clamp(16px, 2.2vw, 28px); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.head { display: flex; flex-direction: column; gap: 16px; max-width: 60ch; }
.head h2 { font-size: var(--s-3); }

.incl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 clamp(24px, 4vw, 56px); }
.incl div { padding: 16px 0; border-bottom: 1px solid var(--line-soft); font-size: var(--s-1); color: var(--ink); }
.incl div::before { content: "·"; color: var(--terra-500); margin-right: 12px; }

.person { display: flex; flex-direction: column; gap: 14px; }
.person__name { font-family: var(--display); font-size: var(--s-2); color: var(--ink); }
.person__note { font-size: .88rem; color: var(--ink-3); }
.person__more { display: none; font-size: .88rem; color: var(--ink-2); padding-top: 8px; border-top: 1px solid var(--line-soft); }
.person.is-open .person__more { display: block; }
.person__btn {
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px;
  font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--terra-600);
}
.person__btn span:last-child { font-size: 1.1rem; transition: transform .3s; }
.person.is-open .person__btn span:last-child { transform: rotate(45deg); }

.guest {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: clamp(24px, 4vw, 56px); align-items: center;
  background: var(--ink); color: var(--sand-100); padding: clamp(24px, 3.5vw, 52px);
}
.guest h3 { color: var(--sand-50); font-size: var(--s-2); }
.guest .eyebrow { color: var(--terra-400); }
.guest .shot { border-color: rgba(250,246,239,.2); }

.menu-card { background: var(--sand-50); border: 1px solid var(--line-soft); display: flex; flex-direction: column; }
.menu-card__btn { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; padding: 22px 24px; background: none; border: 0; cursor: pointer; text-align: left; }
.menu-card__btn h3 { font-size: var(--s-2); }
.menu-card__sign { font-size: 1.4rem; color: var(--terra-500); transition: transform .3s; flex: none; }
.menu-card.is-open .menu-card__sign { transform: rotate(45deg); }
.menu-card__body { display: none; padding: 0 24px 26px; }
.menu-card.is-open .menu-card__body { display: block; }
.menu-card__body ul { margin: 12px 0 0; padding-left: 18px; color: var(--ink-2); }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 3vw, 44px); }
.step__n { font-family: var(--display); font-size: var(--s-2); color: var(--terra-500); }
.step h3 { font-family: var(--sans); font-weight: 700; font-size: var(--s-1); margin: 8px 0 6px; }

.chief { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 76px); align-items: center; }
.chief__facts { display: flex; flex-direction: column; }
.chief__facts div { padding: 12px 0; border-top: 1px solid var(--line-soft); font-size: var(--s-1); color: var(--ink); }

.gal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 1.6vw, 20px); }
.gal figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.gal figcaption { font-size: .82rem; color: var(--ink-3); }

/* ---------- подвал ---------- */

.ftr { background: var(--ink); color: var(--sand-200); }
.ftr a { color: var(--sand-200); }
.ftr a:hover { color: var(--terra-400); }
.ftr__grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 40px; padding-block: clamp(44px, 6vw, 80px); }
.ftr h4 { font-family: var(--sans); font-size: var(--s--1); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-4); margin: 0 0 14px; }
.ftr p, .ftr a { font-size: .9rem; }
.ftr__links a { display: block; padding: 5px 0; }
.ftr__legal { border-top: 1px solid rgba(250,246,239,.12); padding-block: 22px; display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; font-size: .76rem; color: var(--ink-4); }

/* ---------- служебное ---------- */

.note { padding: 14px 18px; border-left: 2px solid var(--terra-500); background: rgba(196,113,79,.08); font-size: .9rem; color: var(--ink-2); }
.tbd { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--terra-500); border: 1px solid rgba(179,90,56,.4); padding: 3px 9px; display: inline-block; }

.modal { position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; padding: var(--gutter);
  background: rgba(42,36,32,.55); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
.modal.is-open { opacity: 1; visibility: visible; }
.modal__card { width: min(520px, 100%); background: var(--sand-50); padding: clamp(24px, 3vw, 40px); display: flex; flex-direction: column; gap: 18px; }

.rise { animation: rise .8s cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise { from { opacity: .5; transform: translateY(14px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  html { scroll-behavior: auto; }
}

/* нижняя панель быстрой связи — только на телефоне */
.mbar {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 65;
  background: var(--sand-50); border-top: 1px solid var(--line);
  padding: 10px 14px; gap: 10px;
  box-shadow: 0 -8px 24px rgba(42,36,32,.08);
}
.mbar .btn { flex: 1; min-height: 46px; padding: 10px 12px; width: auto; letter-spacing: .06em; }
.swipe-hint { display: none; font-size: .76rem; color: var(--ink-3); }

/* ---------- адаптив ---------- */

@media (max-width: 1240px) { .hdr__tel { display: none; } }
@media (max-width: 1080px) {
  .nav { display: none; }
  .burger { display: block; }
  .g-5 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .gal { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 860px) {
  .price, .chief, .guest { grid-template-columns: minmax(0, 1fr); }
  /* кадры на телефоне короче — экран прокручивается быстрее */
  .shot--tall { aspect-ratio: 4 / 5; }
  .shot--hero { min-height: 340px; }
  .sec { padding-block: clamp(52px, 11vw, 80px); }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .hero { min-height: 92svh; }
  .hero__scroll { display: none; }
}
@media (max-width: 620px) {
  .g-2, .g-3, .g-4 { grid-template-columns: minmax(0, 1fr); }
  .incl { grid-template-columns: minmax(0, 1fr); }
  .ftr__grid { grid-template-columns: minmax(0, 1fr); }
  .btn { width: 100%; }
  .row .btn { width: auto; }

  /* карточки мастеров — горизонтальная лента со снапом вместо башни из пяти блоков */
  .g-5 {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter);

function openModal(title, text) {
  $("#modal-body").innerHTML = `<h3 style="font-size:var(--s-2)">${title}</h3><p class="muted">${text}</p>
    <button class="btn btn--line" type="button" data-modal-close>Понятно</button>`;
  $("#modal").classList.add("is-open");
}

const B2B_PATH = "/event-agentstvam/";

function route() {
  const hash = location.hash;
  const isAgencies = location.pathname.replace(/\/?$/, "/") === B2B_PATH || hash.startsWith("#/agencies");
  const view = $("#view");

  if (view.dataset.page !== (isAgencies ? "agencies" : "home")) {
    view.innerHTML = isAgencies ? PAGES.agencies() : PAGES.home();
    view.dataset.page = isAgencies ? "agencies" : "home";
    document.title = isAgencies ? B2B.title : "Magic Catering — кальянный кейтеринг в Москве";
    setDescription(isAgencies ? B2B.description
      : "Кальянный кейтеринг для частных и корпоративных событий в Москве и МО. Мастера, оборудование, доставка и обслуживание.");
    bindPage();
    window.scrollTo({ top: 0, behavior: "auto" });
    return;
  }

  // тот же раздел: якорная прокрутка
  if (!isAgencies && hash && hash.length > 1 && !hash.startsWith("#/")) {
    const el = document.getElementById(hash.slice(1));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function setDescription(text) {
  let m = document.querySelector('meta[name="description"]');
  if (!m) { m = document.createElement("meta"); m.name = "description"; document.head.appendChild(m); }
  m.content = text;
}

function bindPage() {
  // раскрывающиеся карточки меню
  $$("[data-menu] .menu-card__btn").forEach((b) => {
    b.addEventListener("click", () => b.closest("[data-menu]").classList.toggle("is-open"));
  });

  // карточки мастеров — детали по нажатию
  $$("[data-person] .person__btn").forEach((b) => {
    b.addEventListener("click", () => b.closest("[data-person]").classList.toggle("is-open"));
  });

  // демо-формы
  $$("#view form").forEach((f) => {
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      openModal("Демо-версия",
        "Форма собрана и проверяет поля, но заявка никуда не уходит. В боевой версии она попадает в CRM и менеджеру в мессенджер.");
      f.reset();
    });
  });
}

function boot() {
  $("#app").insertAdjacentHTML("afterbegin", header());
  $("#app").insertAdjacentHTML("beforeend", footer());

  route();
  window.addEventListener("hashchange", route);

  // бургер
  $("#burger").addEventListener("click", () => {
    $("#drawer").classList.add("is-open");
    document.body.classList.add("is-locked");
  });
  const closeDrawer = () => { $("#drawer").classList.remove("is-open"); document.body.classList.remove("is-locked"); };
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer").addEventListener("click", (e) => { if (e.target.tagName === "A") closeDrawer(); });

  // шапка при прокрутке
  const hdr = $(".hdr");
  const overPhoto = () => hdr.classList.toggle("hdr--over", !!$(".hero"));
  const onScroll = () => hdr.classList.toggle("is-stuck", window.scrollY > 20);
  overPhoto();
  window.addEventListener("hashchange", () => setTimeout(overPhoto, 50));
  window.addEventListener("popstate", () => setTimeout(overPhoto, 50));
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // подсветка активного раздела в меню
  const ids = NAV.filter((n) => n.href.startsWith("#") && !n.href.startsWith("#/")).map((n) => n.href.slice(1));
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      $$(".nav a").forEach((a) => a.classList.toggle("is-on", a.getAttribute("href") === "#" + en.target.id));
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  const watch = () => ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
  watch();
  window.addEventListener("hashchange", () => setTimeout(watch, 100));

  // внутренние переходы без перезагрузки: /event-agentstvam/ и обратно
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="/"]');
    if (!a || a.target === "_blank") return;
    e.preventDefault();
    history.pushState(null, "", a.getAttribute("href"));
    route();
    window.scrollTo({ top: 0, behavior: "auto" });
  });
  window.addEventListener("popstate", route);

  // модалка
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-modal-close]") || e.target.id === "modal") $("#modal").classList.remove("is-open");
    const home = e.target.closest("[data-home]");
    if (home) { e.preventDefault(); history.pushState(null, "", "/"); route(); window.scrollTo({ top: 0, behavior: "auto" }); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#modal").classList.remove("is-open"); closeDrawer(); } });

  // стартовый экран
  const sp = $("#splash");
  const hide = () => { if (sp) { sp.style.opacity = "0"; setTimeout(() => sp.remove(), 500); } };
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.all([fonts, new Promise((r) => setTimeout(r, 350))]).then(hide);
  setTimeout(hide, 3000);
}

document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
